<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Ma grille d’automatismes — fiche élève</title>
    <link rel="stylesheet" href="fiche.css?v=2">
  </head>
  <body>
    <main class="page">
      <header>
        <div><p>Mathématiques · Première STI2D</p><h1>Ma grille d’automatismes</h1></div>
      </header>

      <p class="instructions">Pour chaque séance : écris la lettre A, B, C ou D choisie, corrige avec une autre couleur, puis compte un point par réponse juste.</p>

      <section class="sessions"></section>

      <template id="session-template">
        <article class="session">
          <div class="session-head"><strong></strong><span>Date : ____ / ____ / ______</span><b></b></div>
          <table aria-label="Réponses de la séance"><thead><tr></tr></thead><tbody><tr></tr></tbody></table>
        </article>
      </template>

      <footer><span>Mon objectif pour la prochaine séance :</span><div></div></footer>
      <button class="print-button" type="button" onclick="window.print()">Imprimer cette fiche</button>
    </main>
    <script>
      const count = Math.min(12, Math.max(1, Number(new URLSearchParams(location.search).get("n")) || 6));
      const targetSessions = ({ 4: 12, 6: 8, 8: 6, 10: 4, 12: 4 })[count] || 8;
      const sessions = document.querySelector(".sessions");
      const template = document.querySelector("#session-template");
      for (let sessionIndex = 0; sessionIndex < targetSessions; sessionIndex += 1) {
        const session = template.content.firstElementChild.cloneNode(true);
        session.querySelector("strong").textContent = `Séance ${sessionIndex + 1}`;
        session.querySelector("b").textContent = `Score : ____ / ${count}`;
        const questionRow = session.querySelector("thead tr");
        const answerRow = session.querySelector("tbody tr");
        for (let index = 1; index <= count; index += 1) {
          const question = document.createElement("th");
          question.scope = "col";
          question.textContent = index;
          questionRow.append(question);
          answerRow.append(document.createElement("td"));
        }
        sessions.append(session);
      }
    </script>
  </body>
</html>
